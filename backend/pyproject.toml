[project]
name = "market-pulse-terminal-backend"
version = "0.1.0"
description = "Market Pulse Terminal API: snapshot builder, providers, streaming and health (SRS §5)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    # Unofficial Yahoo wrapper: the only source of index levels (SRS §4.1).
    "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    # Validates API responses against shared/schema in the contract tests (AGENTS.md §8);
    # CI installs the same range for scripts/validate_schema.py.
    "jsonschema>=4.18,<5",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Run from backend/: `uv run uvicorn app.main:app`. The package is not built or
# installed; tests and the app import it from the working directory.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from the JSON Schema (scripts/gen_types.sh); regenerate instead of editing.
extend-exclude = ["app/models/market_snapshot.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# yfinance ships no type information; its responses are parsed defensively in the adapter.
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
